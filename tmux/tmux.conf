set -g mouse on

# Let OSC 52 sequences from inside a pane (e.g. zsh's clipcopy) reach the outer terminal.
# tmux's default, "external", only forwards OSC 52 for its own copy-mode yanks and
# swallows anything an application inside the pane sends — "on" passes it through (and
# also stashes it in a tmux buffer).
set -g set-clipboard on

######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour colour5
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# panes
set -g pane-border-status top
# Label: index, a sticky name if set (tmux set -p @name ttyUSB2), else the shell-set
# title, plus the running command. @name survives zsh overwriting pane_title on every
# prompt, so a manually-named pane (e.g. a minicom port) keeps its label.
set -g pane-border-format "#{?pane_active,#[fg=colour9 bold],#[fg=colour250]} #{pane_index} #{?@name,#{@name},#{pane_title}} #[default]#{?pane_active,#[fg=colour9],#[fg=colour244]}(#{pane_current_command}) "
bind N command-prompt -p "pane name:" "set -p @name '%%'"
set -g pane-border-style 'fg=colour19 bg=colour0'
set -g pane-active-border-style 'bg=colour0 fg=colour9'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour18 fg=colour137 dim'
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour19] %d/%m #[fg=colour233,bg=colour8] %H:%M:%S %d-%b-%y #[fg=colour255,bg=colour1,bold] #S '
set -g status-right-length 80
set -g status-left-length 20

setw -g window-status-current-style 'fg=colour1 bg=colour19 bold'
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]#F '

setw -g window-status-style 'fg=colour9 bg=colour18'
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'

# messages
set -g message-style 'fg=colour232 bg=colour16 bold'

set-option -g history-limit 10000

# Truecolor/italics for both Ghostty (macOS) and Linux boxes, without breaking an old
# Linux box whose terminfo db predates tmux-256color: fall back to screen-256color if
# tmux-256color isn't registered locally. This is what makes bat/config's
# --italic-text=always actually render, and what Ghostty's xterm-ghostty TERM needs to
# be recognized as RGB-capable.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -as terminal-overrides ",*:Smulx=\E[4::%p1%dm,*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"
